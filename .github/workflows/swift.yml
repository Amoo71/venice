name: Build iOS IPA

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

jobs:
  build-unsigned-ipa:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build archive (unsigned)
        run: |
          xcodebuild \
            -project LiquidBrowser.xcodeproj \
            -scheme LiquidBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LiquidBrowser.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/LiquidBrowser.xcarchive/Products/Applications/LiquidBrowser.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found: $APP_PATH"
            exit 1
          fi

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          cd build
          /usr/bin/zip -r LiquidBrowser-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBrowser-unsigned-ipa
          path: build/LiquidBrowser-unsigned.ipa
